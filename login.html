<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PhishDetect</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .login-container {
      flex: 1;
      padding: 4rem 0;
      background-color: rgba(14, 165, 233, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-card {
      width: 100%;
      max-width: 28rem;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-gray-200);
      padding: 2rem;
    }
    
    @media (prefers-color-scheme: dark) {
      .login-card {
        background-color: rgba(30, 41, 59, 0.2);
        border-color: var(--color-gray-700);
      }
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .login-icon {
      margin: 0 auto 1rem;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
    }
    
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-gray-400);
    }
    
    .input-wrapper input {
      width: 100%;
      padding: 0.625rem 0.75rem 0.625rem 2.25rem;
      border: 1px solid var(--color-gray-300);
      border-radius: var(--radius);
      font-size: 0.875rem;
    }
    
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
    }
    
    @media (prefers-color-scheme: dark) {
      .input-wrapper input {
        background-color: var(--color-gray-900);
        border-color: var(--color-gray-700);
        color: var(--color-gray-200);
      }
    }
    
    .form-error {
      color: var(--color-red);
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
    
    .login-button {
      margin-top: 1rem;
    }
    
    .login-footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--color-gray-200);
      text-align: center;
      font-size: 0.875rem;
      color: var(--color-gray-600);
    }
    
    @media (prefers-color-scheme: dark) {
      .login-footer {
        border-color: var(--color-gray-700);
      }
    }
    
    .login-footer a {
      color: var(--color-primary);
      font-weight: 500;
      text-decoration: none;
    }
    
    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
            </svg>
            <span>PhishDetect</span>
          </a>
        </div>
        
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="scan.html">Scan</a>
          <a href="index.html#features">Features</a>
          <a href="index.html#pricing">Pricing</a>
        </div>
        
        <div class="nav-buttons">
          <a href="login.html" class="btn-outline">Log In</a>
          <a href="login.html" class="btn-primary">Get Started</a>
        </div>
        
        <button class="mobile-menu-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>
    
    <!-- Mobile Menu -->
    <div class="mobile-menu">
      <a href="index.html">Home</a>
      <a href="scan.html">Scan</a>
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="login.html">Log In</a>
      <a href="login.html" class="btn-primary">Get Started</a>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
            </svg>
          </div>
          <h1 class="text-2xl">Welcome Back</h1>
          <p>Sign in to access your PhishDetect account</p>
        </div>
        
        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-error" id="email-error"></div>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-error" id="password-error"></div>
          </div>
          
          <button type="submit" class="btn-primary full-width login-button" id="login-button">
            <span id="login-text">Sign In</span>
            <span id="login-loading" class="hidden">
              <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
              </svg>
            </span>
          </button>
          
          <div class="text-center">
            <a href="#" class="text-sm">Forgot your password?</a>
          </div>
        </form>
        
        <div class="login-footer">
          <p>
            Don't have an account?
            <a href="#">Create Account</a>
          </p>
        </div>
      </div>
    </div>
    
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; <span id="current-year"></span> PhishDetect. All rights reserved.</p>
          
          <div class="footer-legal">
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
            <a href="#">Security</a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Set current year in the footer
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    // Mobile menu toggle
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mobileMenu = document.querySelector('.mobile-menu');
    
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
    });
    
    // Login form submission
    const loginForm = document.getElementById('login-form');
    const emailField = document.getElementById('email');
    const passwordField = document.getElementById('password');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const loginButton = document.getElementById('login-button');
    const loginText = document.getElementById('login-text');
    const loginLoading = document.getElementById('login-loading');
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Reset errors
      emailError.textContent = '';
      passwordError.textContent = '';
      
      // Validate
      let hasError = false;
      
      if (!emailField.value) {
        emailError.textContent = 'Email is required';
        hasError = true;
      } else if (!isValidEmail(emailField.value)) {
        emailError.textContent = 'Please enter a valid email address';
        hasError = true;
      }
      
      if (!passwordField.value) {
        passwordError.textContent = 'Password is required';
        hasError = true;
      } else if (passwordField.value.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters';
        hasError = true;
      }
      
      if (hasError) return;
      
      // Show loading
      loginButton.disabled = true;
      loginText.classList.add('hidden');
      loginLoading.classList.remove('hidden');
      
      // Simulate login request
      try {
        // In a real app, this would be an API call
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Redirect to dashboard or home page
        window.location.href = 'index.html';
      } catch (error) {
        alert('Login failed. Please check your credentials and try again.');
      } finally {
        // Reset button state
        loginButton.disabled = false;
        loginText.classList.remove('hidden');
        loginLoading.classList.add('hidden');
      }
    });
    
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }
  </script>
</body>
</html>
